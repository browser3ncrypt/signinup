<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SPACE  SHOOTER</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
       
        body {
            margin: 0;
            padding: 0;
            background: #0a001f;
            color: #ff0;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
            image-rendering: pixelated;
        }
       
        .arcade-cabinet {
            border: 20px solid #ffd700;
            border-image: linear-gradient(#ff00ff, #00ffff, #ffff00) 1;
            box-shadow: 0 0 60px #ff00ff,
                        0 0 100px #00ffff,
                        inset 0 0 40px rgba(255, 215, 0, 0.6);
            background: #1a0033;
            padding: 15px;
            border-radius: 15px;
            max-width: 100%;
            width: 100%;
            max-width: 720px;
            box-sizing: border-box;
        }
       
        canvas {
            background: #000033;
            border: 8px solid #ffd700;
            box-shadow: 0 0 30px #ff00ff;
            image-rendering: pixelated;
            touch-action: none;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
       
        .header {
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #ff0,
                         0 0 20px #f0f;
        }
       
        h1 {
            font-size: 24px;
            margin: 0;
            color: #ff0;
            text-shadow: 4px 4px 0 #f00;
        }
       
        .stats {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 8px;
            background: rgba(0,0,0,0.7);
            padding: 8px 12px;
            margin-bottom: 10px;
            border: 4px solid #00ff00;
            color: #0f0;
            font-size: 13px;
        }
       
        .stat-item {
            grid-column: span 3;
            text-align: center;
            padding: 4px 0;
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #00ff00;
            border-radius: 4px;
        }
       
        .controls {
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
        }
       
        button {
            background: #ff00ff;
            color: white;
            border: 4px solid #ffff00;
            padding: 10px 20px;
            font-family: 'Press Start 2P', cursive;
            font-size: 15px;
            cursor: pointer;
            margin: 5px;
            box-shadow: 0 0 15px #ff0;
            touch-action: manipulation;
        }
       
        .neon-text {
            animation: neon 1.5s infinite alternate;
        }
       
        @keyframes neon {
            from { text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #ff00ff; }
            to { text-shadow: 0 0 10px #fff, 0 0 20px #ff00ff, 0 0 40px #00ffff; }
        }
       
        /* 12-column responsive adjustments */
        @media (max-width: 640px) {
            .arcade-cabinet {
                border-width: 12px;
                padding: 10px;
                border-radius: 10px;
            }
            
            h1 {
                font-size: 20px;
            }
            
            .stats {
                grid-template-columns: repeat(4, 1fr);
                font-size: 11px;
                padding: 6px 8px;
                gap: 6px;
            }
            
            .stat-item {
                grid-column: span 1;
            }
            
            button {
                padding: 8px 16px;
                font-size: 13px;
                margin: 4px;
            }
            
            .controls p {
                font-size: 10px;
            }
        }
        
        @media (max-width: 480px) {
            .arcade-cabinet {
                border-width: 8px;
                padding: 8px;
            }
            
            canvas {
                border-width: 6px;
            }
        }
    </style>
</head>
<body>
    <div class="arcade-cabinet">
        <div class="header">
            <h1 class="neon-text">🔫 SPACE SHOOTER 🔫</h1>
            <p style="margin:5px; color:#0f0; font-size:13px;">ALWAYS WIN • NEVER LOSE</p>
        </div>
       
        <div class="stats">
            <div class="stat-item">COINS: <span id="coins">500</span></div>
            <div class="stat-item">SCORE: <span id="score">0</span></div>
            <div class="stat-item">LEVEL: <span id="level">1</span></div>
            <div class="stat-item">HIGH: <span id="high">1240</span></div>
        </div>
       
        <canvas id="game" width="640" height="480"></canvas>
       
        <div class="controls">
            <button onclick="startGame()">INSERT COIN &amp; START</button>
            <button onclick="toggleSound()">🔊 SOUND</button>
            <p style="margin:8px; font-size:11px; color:#aaa;">
                ← → MOVE &nbsp; SPACE / TAP SHOOT &nbsp; P = PAUSE
            </p>
            <p style="margin:5px; font-size:10px; color:#666;">On mobile: Drag finger to move ship • Tap bottom half to shoot</p>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
       
        // Responsive canvas scaling (keeps 640x480 game logic, scales display)
        function resizeCanvas() {
            const maxWidth = Math.min(window.innerWidth - 40, 720);
            const scale = maxWidth / 640;
            canvas.style.width = (640 * scale) + 'px';
            canvas.style.height = (480 * scale) + 'px';
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
       
        // Game variables
        let player = { x: 300, y: 400, width: 40, height: 40, speed: 6, shield: 0 };
        let bullets = [];
        let enemies = [];
        let bosses = [];
        let powerups = [];
        let particles = [];
        let score = 0;
        let coins = 500;
        let highScore = 1240;
        let level = 1;
        let gameOver = true;
        let paused = false;
        let keys = {};
        let lastShot = 0;
        let soundEnabled = true;
        let rapidFire = false;
        let multiShot = false;
        let rapidFireTime = 0;
        let multiShotTime = 0;
        let showLevelUp = 0; // frames to show LEVEL UP! text
        
        // Touch controls
        let touchMoveX = null;
        let isShooting = false;
        
        function playSound(freq, duration) {
            if (!soundEnabled) return;
            try {
                const audio = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audio.createOscillator();
                osc.frequency.value = freq;
                osc.connect(audio.destination);
                osc.start();
                setTimeout(() => osc.stop(), duration);
            } catch(e) {}
        }
        
        function createEnemy() {
            enemies.push({
                x: Math.random() * (canvas.width - 40),
                y: -40,
                width: 35,
                height: 35,
                speed: 2.2 + level * 0.7 + Math.random() * 1.8,
                health: 1
            });
        }
        
        function createBoss() {
            const bossType = Math.random() < 0.4 ? 'fast' : 'tank'; // variety for more bosses
            bosses.push({
                x: canvas.width / 2 - 50,
                y: -80,
                width: 100,
                height: 80,
                speed: bossType === 'fast' ? 2.2 + level * 0.4 : 1.0 + level * 0.25,
                health: bossType === 'fast' ? 6 + Math.floor(level * 2.5) : 12 + Math.floor(level * 3),
                shootTimer: 0,
                type: bossType
            });
        }
        
        function createPowerUp(x, y) {
            const types = ['speed', 'rapid', 'multi', 'shield', 'coins'];
            powerups.push({
                x: x,
                y: y,
                width: 24,
                height: 24,
                type: types[Math.floor(Math.random() * types.length)],
                vy: 2.5
            });
        }
        
        function createExplosion(x, y, big = false) {
            const count = big ? 30 : 15;
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x + Math.random() * 20 - 10,
                    y: y + Math.random() * 20 - 10,
                    vx: Math.random() * 9 - 4.5,
                    vy: Math.random() * 9 - 4.5,
                    life: big ? 50 : 30,
                    color: ['#ff0', '#f00', '#0f0', '#ff00ff'][Math.floor(Math.random()*4)]
                });
            }
            playSound(big ? 50 : 90, big ? 400 : 180);
        }
        
        function drawPlayer() {
            ctx.fillStyle = player.shield > 0 ? '#00ffcc' : '#00ffff';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = '#ff00ff';
            ctx.fillRect(player.x + 10, player.y + 12, 20, 12);
            ctx.fillStyle = '#ffff00';
            ctx.fillRect(player.x + 18, player.y - 8, 5, 18);
           
            if (player.shield > 0) {
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 5;
                ctx.globalAlpha = 0.5 + Math.sin(Date.now()/100) * 0.2;
                ctx.beginPath();
                ctx.arc(player.x + 20, player.y + 20, 30, 0, Math.PI * 2);
                ctx.stroke();
                ctx.globalAlpha = 1;
            }
        }
        
        function update() {
            if (gameOver || paused) return;
           
            // Movement
            if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
            if (keys['ArrowRight'] || keys['d']) player.x += player.speed;
           
            // Touch movement
            if (touchMoveX !== null) {
                player.x += (touchMoveX - player.x - 20) * 0.28;
            }
           
            player.x = Math.max(10, Math.min(canvas.width - player.width - 10, player.x));
           
            // Shooting
            const shootDelay = rapidFire ? 65 : 155;
            if ((keys[' '] || isShooting) && Date.now() - lastShot > shootDelay) {
                if (multiShot) {
                    bullets.push({ x: player.x + 8, y: player.y - 5, speed: 14 });
                    bullets.push({ x: player.x + 18, y: player.y - 12, speed: 14 });
                    bullets.push({ x: player.x + 28, y: player.y - 5, speed: 14 });
                } else {
                    bullets.push({ x: player.x + 18, y: player.y - 10, speed: 14 });
                }
                lastShot = Date.now();
                playSound(680, 35);
            }
           
            // Update bullets + off-screen removal (now supports enemy bullets going down)
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                if (bullets[i].y < -20 || bullets[i].y > canvas.height + 20) {
                    bullets.splice(i, 1);
                }
            }
           
            // Enemy bullet → player collision
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                if (b.isEnemy &&
                    b.x + 4 > player.x && b.x - 4 < player.x + player.width &&
                    b.y + 10 > player.y && b.y - 10 < player.y + player.height) {
                    
                    if (player.shield > 0) {
                        player.shield = 0;
                    } else {
                        createExplosion(player.x + 20, player.y + 20, true);
                        gameOver = true;
                        if (score > highScore) {
                            highScore = score;
                            document.getElementById('high').textContent = highScore;
                        }
                        playSound(140, 900);
                        return;
                    }
                    createExplosion(b.x, b.y, false);
                    bullets.splice(i, 1);
                    break;
                }
            }
           
            // Update normal enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.y += e.speed;
               
                if (e.y > canvas.height + 20) {
                    enemies.splice(i, 1);
                    continue;
                }
               
                // Player collision
                if (e.x < player.x + player.width && e.x + e.width > player.x &&
                    e.y < player.y + player.height && e.y + e.height > player.y) {
                    if (player.shield > 0) {
                        player.shield = 0;
                    } else {
                        createExplosion(player.x + 20, player.y + 20, true);
                        gameOver = true;
                        if (score > highScore) {
                            highScore = score;
                            document.getElementById('high').textContent = highScore;
                        }
                        playSound(140, 900);
                        return;
                    }
                    createExplosion(e.x + 18, e.y + 18);
                    enemies.splice(i, 1);
                    continue;
                }
               
                // Bullet hits
                for (let j = bullets.length - 1; j >= 0; j--) {
                    const b = bullets[j];
                    if (!b.isEnemy && b.x > e.x && b.x < e.x + e.width &&
                        b.y > e.y && b.y < e.y + e.height) {
                        createExplosion(e.x + 18, e.y + 18);
                        enemies.splice(i, 1);
                        bullets.splice(j, 1);
                        score += 120 * level;
                        if (Math.random() < 0.38) createPowerUp(e.x + 8, e.y + 8);
                        if (Math.random() < 0.45) coins += 20;
                        document.getElementById('score').textContent = score;
                        document.getElementById('coins').textContent = coins;
                        playSound(950, 60);
                        break;
                    }
                }
            }
           
            // Boss logic (more frequent + variety)
            for (let i = bosses.length - 1; i >= 0; i--) {
                const b = bosses[i];
                b.y += b.speed * 0.65;
                b.x += Math.sin(Date.now() / 380) * (b.type === 'fast' ? 2.8 : 1.6);
               
                if (b.y > canvas.height + 100) {
                    bosses.splice(i, 1);
                    continue;
                }
               
                // Faster shooting on higher levels / fast bosses
                b.shootTimer++;
                const shootRate = b.type === 'fast' ? 28 : 42 - Math.min(level * 3, 25);
                if (b.shootTimer > shootRate) {
                    bullets.push({ x: b.x + 28, y: b.y + 65, speed: -8, isEnemy: true });
                    bullets.push({ x: b.x + 72, y: b.y + 65, speed: -8, isEnemy: true });
                    if (level > 5 && Math.random() < 0.3) {
                        bullets.push({ x: b.x + 50, y: b.y + 65, speed: -11, isEnemy: true });
                    }
                    b.shootTimer = 0;
                    playSound(280, 70);
                }
               
                // Player collision with boss
                if (b.x < player.x + player.width && b.x + b.width > player.x &&
                    b.y < player.y + player.height && b.y + b.height > player.y) {
                    if (player.shield > 0) player.shield = 0;
                    else {
                        createExplosion(player.x + 20, player.y + 20, true);
                        gameOver = true;
                        if (score > highScore) {
                            highScore = score;
                            document.getElementById('high').textContent = highScore;
                        }
                        playSound(140, 900);
                        return;
                    }
                }
               
                // Bullet hits on boss
                for (let j = bullets.length - 1; j >= 0; j--) {
                    const bu = bullets[j];
                    if (!bu.isEnemy && bu.x > b.x && bu.x < b.x + b.width &&
                        bu.y > b.y && bu.y < b.y + b.height) {
                        bullets.splice(j, 1);
                        b.health--;
                        createExplosion(bu.x, bu.y, false);
                        playSound(800, 40);
                       
                        if (b.health <= 0) {
                            createExplosion(b.x + 50, b.y + 40, true);
                            score += 950 * level;
                            coins += 200;
                            document.getElementById('score').textContent = score;
                            document.getElementById('coins').textContent = coins;
                            bosses.splice(i, 1);
                        }
                        break;
                    }
                }
            }
           
            // Power-ups
            for (let i = powerups.length - 1; i >= 0; i--) {
                const p = powerups[i];
                p.y += p.vy;
                if (p.y > canvas.height) {
                    powerups.splice(i, 1);
                    continue;
                }
               
                if (p.x < player.x + player.width && p.x + p.width > player.x &&
                    p.y < player.y + player.height && p.y + p.height > player.y) {
                    if (p.type === 'speed') player.speed = 11;
                    else if (p.type === 'rapid') { rapidFire = true; rapidFireTime = Date.now() + 9500; }
                    else if (p.type === 'multi') { multiShot = true; multiShotTime = Date.now() + 9500; }
                    else if (p.type === 'shield') player.shield = 420;
                    else if (p.type === 'coins') coins += 120;
                   
                    document.getElementById('coins').textContent = coins;
                    playSound(1250, 140);
                    powerups.splice(i, 1);
                }
            }
           
            // Timers
            if (rapidFire && Date.now() > rapidFireTime) rapidFire = false;
            if (multiShot && Date.now() > multiShotTime) multiShot = false;
            if (player.shield > 0) player.shield--;
           
            // Spawn logic (more enemies at higher levels)
            const spawnRate = Math.max(0.018, 0.065 - level * 0.011);
            if (Math.random() < spawnRate) createEnemy();
           
            // MORE BOSSES: every 3 levels + chance increases with level
            if (level % 3 === 0 && bosses.length === 0 && Math.random() < (0.018 + level * 0.003)) {
                createBoss();
            }
           
            // Level progression (FASTER level ups - more frequent)
            if (score > level * 950) {
                level++;
                document.getElementById('level').textContent = level;
                playSound(900, 120);
                playSound(1200, 180);
                showLevelUp = 110; // show LEVEL UP! flash
                
                // Guaranteed boss on every 3rd level up
                if (level % 3 === 0 && bosses.length === 0) {
                    createBoss();
                }
            }
           
            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }
        
        function draw() {
            ctx.fillStyle = '#000022';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
           
            // Starfield (faster on higher levels)
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 110; i++) {
                const x = (i * 29) % canvas.width;
                const y = (Date.now() / (16 - Math.min(level, 9)) + i * 23) % (canvas.height + 60);
                ctx.fillRect(x, y, 2, 2);
            }
           
            drawPlayer();
           
            // Player bullets (yellow)
            ctx.fillStyle = '#ffff00';
            bullets.forEach(b => {
                if (!b.isEnemy) {
                    ctx.fillRect(b.x - 3, b.y, 8, 22);
                }
            });
           
            // Enemy bullets (red)
            ctx.fillStyle = '#ff4444';
            bullets.forEach(b => {
                if (b.isEnemy) {
                    ctx.fillRect(b.x - 3, b.y, 8, 22);
                }
            });
           
            // Normal enemies
            ctx.fillStyle = '#ff00ff';
            enemies.forEach(e => {
                ctx.fillRect(e.x, e.y, e.width, e.height);
                ctx.fillStyle = '#00ff88';
                ctx.fillRect(e.x + 10, e.y + 10, 15, 12);
                ctx.fillStyle = '#ff00ff';
            });
           
            // Bosses (different colors per type)
            bosses.forEach(b => {
                ctx.fillStyle = b.type === 'fast' ? '#ff8800' : '#ff3300';
                ctx.fillRect(b.x, b.y, b.width, b.height);
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(b.x + 25, b.y + 15, 50, 25);
            });
           
            // Power-ups
            powerups.forEach(p => {
                let emoji = '⭐';
                if (p.type === 'speed') emoji = '⚡';
                else if (p.type === 'rapid') emoji = '🔫';
                else if (p.type === 'multi') emoji = '🔀';
                else if (p.type === 'shield') emoji = '🛡️';
                else if (p.type === 'coins') emoji = '💰';
                ctx.font = '22px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(emoji, p.x + 12, p.y + 22);
            });
           
            // Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life / 40;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 8, 8);
            });
            ctx.globalAlpha = 1;
           
            // LEVEL UP flash
            if (showLevelUp > 0) {
                ctx.globalAlpha = 0.7 + Math.sin(showLevelUp / 4) * 0.3;
                ctx.fillStyle = '#00ff88';
                ctx.font = 'bold 38px Press Start 2P';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#00ff00';
                ctx.shadowBlur = 20;
                ctx.fillText('LEVEL UP!', canvas.width / 2, 130);
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
                showLevelUp--;
            }
           
            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.88)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff0000';
                ctx.font = '30px Press Start 2P';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width/2, 190);
                ctx.fillStyle = '#ffff00';
                ctx.font = '16px Press Start 2P';
                ctx.fillText('FINAL SCORE: ' + score, canvas.width/2, 250);
                ctx.fillText('LEVEL REACHED: ' + level, canvas.width/2, 280);
                ctx.fillText('TAP / CLICK TO RESTART', canvas.width/2, 360);
            }
        }
        
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        function startGame() {
            if (!gameOver) return;
            score = 0;
            level = 1;
            bullets = [];
            enemies = [];
            bosses = [];
            powerups = [];
            particles = [];
            player.x = 300;
            player.speed = 6;
            player.shield = 0;
            rapidFire = false;
            multiShot = false;
            showLevelUp = 0;
            touchMoveX = null;
            gameOver = false;
            document.getElementById('score').textContent = '0';
            document.getElementById('level').textContent = '1';
            playSound(480, 80);
            playSound(720, 120);
        }
        
        function toggleSound() {
            soundEnabled = !soundEnabled;
        }
        
        // Keyboard
        window.addEventListener('keydown', e => {
            keys[e.key] = true;
            if (e.key.toLowerCase() === 'p') paused = !paused;
            if ((e.key === 'Enter' || e.key === ' ') && gameOver) startGame();
        });
        
        window.addEventListener('keyup', e => {
            keys[e.key] = false;
        });
        
        // Mobile touch controls (improved for better feel)
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (gameOver) {
                startGame();
                return;
            }
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const touchX = (touch.clientX - rect.left) * (640 / rect.width);
            const touchY = touch.clientY - rect.top;
            
            // Bottom third = shoot, upper = move
            if (touchY > rect.height * 0.65) {
                isShooting = true;
            } else {
                touchMoveX = touchX;
            }
        }, { passive: false });
        
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if (gameOver) return;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            touchMoveX = (touch.clientX - rect.left) * (640 / rect.width);
        }, { passive: false });
        
        canvas.addEventListener('touchend', e => {
            isShooting = false;
            setTimeout(() => {
                if (!e.touches || e.touches.length === 0) touchMoveX = null;
            }, 60);
        });
        
        // Desktop mouse support
        let mouseDown = false;
        canvas.addEventListener('mousedown', e => {
            if (gameOver) startGame();
            mouseDown = true;
        });
        canvas.addEventListener('mousemove', e => {
            if (mouseDown) {
                const rect = canvas.getBoundingClientRect();
                touchMoveX = (e.clientX - rect.left) * (640 / rect.width);
            }
        });
        canvas.addEventListener('mouseup', () => {
            mouseDown = false;
            touchMoveX = null;
        });
        
        // Start game loop
        gameLoop();
        
        // Initial demo enemy
        setTimeout(() => {
            if (gameOver) createEnemy();
        }, 700);
        
        // Occasional extra boss for even more boss action
        setInterval(() => {
            if (!gameOver && level > 4 && bosses.length < 2 && Math.random() < 0.35) {
                createBoss();
            }
        }, 14000);
    </script>
</body>
</html>
